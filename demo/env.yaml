apiVersion: dev.example.com/v1alpha1
kind: DevEnvironment
metadata:
  name: demo
spec:
  branch: feature-auth
  namespace: dev-demo
  stack:
    services:
      - name: api
        image: myapp:latest
        ports:
          - containerPort: 8080
            name: http
        env:
          - name: DATABASE_URL
            value: postgres://postgres:5432/app
          - name: REDIS_URL
            value: redis://redis:6379
    databases:
      - name: postgres
        type: postgres
        version: "15"
      - name: redis
        type: redis
        version: "7"
